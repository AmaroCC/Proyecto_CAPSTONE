<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escanear Carta - El Rincón del Dualista</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0c16;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background-color: #121324;
      border-bottom: 1px solid #232542;
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a855f7 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .btn-back {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-back:hover {
      color: #38bdf8;
    }

    .container {
      max-width: 900px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .card-panel {
      background-color: #121324;
      border: 1px solid #232542;
      border-radius: 16px;
      padding: 2rem;
    }

    .title {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .dropzone {
      border: 2px dashed #4338ca;
      border-radius: 12px;
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      background: rgba(30, 27, 75, 0.2);
      transition: border-color 0.2s, background-color 0.2s;
    }

    .dropzone:hover {
      border-color: #38bdf8;
      background: rgba(30, 27, 75, 0.4);
    }

    .result-section {
      display: none;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #232542;
    }

    .grid-result {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 2rem;
    }

    @media (max-width: 640px) {
      .grid-result {
        grid-template-columns: 1fr;
      }
    }

    .preview-box img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #38bdf8;
    }

    .data-group {
      margin-bottom: 1.25rem;
    }

    .data-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .data-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 0.25rem;
    }

    .price-clp {
      font-size: 1.75rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .price-usd {
      color: #64748b;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="brand-title">El Rincón del Dualista</a>
    <a href="/" class="btn-back">← Volver al catálogo</a>
  </nav>

  <main class="container">
    <section class="card-panel">
      <h1 class="title">Escanear y Cotizar Carta</h1>
      <p class="subtitle">Sube una fotografía de tu carta para identificarla automáticamente mediante IA.</p>

      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" style="margin-bottom: 1rem;">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <p style="font-weight: 600; margin-bottom: 0.25rem;">Haz clic para subir o arrastra la foto de tu carta</p>
        <p style="font-size: 0.8rem; color: #94a3b8;">PNG, JPG o WEBP</p>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="subirImagen(event)">
      </div>

      <div class="result-section" id="resultSection">
        <div class="grid-result">
          <div class="preview-box">
            <img id="previewImg" src="" alt="Carta Escaneada">
          </div>
          <div>
            <div class="data-group">
              <span class="data-label">Carta Detectada</span>
              <div class="data-value" id="cardName">-</div>
            </div>

            <div class="data-group">
              <span class="data-label">Estado Estimado</span>
              <div class="data-value" style="color: #6ee7b7;" id="cardCondition">-</div>
            </div>

            <div class="data-group">
              <span class="data-label">Cotización de Mercado</span>
              <div class="price-clp" id="priceClp">$0 CLP</div>
              <div class="price-usd" id="priceUsd">Ref: $0 USD</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    async function subirImagen(event) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('imagen', file);

      try {
        const response = await fetch('/api/cartas/escanear', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('Error al procesar');

        const data = await response.json();

        document.getElementById('previewImg').src = data.imagenBase64;
        document.getElementById('cardName').textContent = data.nombre;
        document.getElementById('cardCondition').textContent = data.estado;
        document.getElementById('priceClp').textContent = '$' + Number(data.precioCLP).toLocaleString('es-CL') + ' CLP';
        document.getElementById('priceUsd').textContent = 'Ref: $' + data.precioUSD.toFixed(2) + ' USD';

        document.getElementById('resultSection').style.display = 'block';
      } catch (err) {
        alert('Error conectando con el servicio de análisis de carta.');
      }
    }
  </script>
</body>
</html>
