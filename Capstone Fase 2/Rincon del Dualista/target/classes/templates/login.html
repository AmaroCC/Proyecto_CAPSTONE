<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - El Rincón del Dualista</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b0c16; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: #121324; border: 1px solid #232542; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .brand { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 0.5rem; background: linear-gradient(135deg, #a855f7, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.8rem; }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.4rem; }
    input { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #2e325a; background: #0b0c16; color: #fff; margin-bottom: 1.2rem; }
    .btn { width: 100%; padding: 0.85rem; background: linear-gradient(135deg, #6366f1, #38bdf8); border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; }
    .error { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; }
    .creds { margin-top: 1.5rem; padding: 1rem; background: #191b30; border-radius: 8px; font-size: 0.8rem; color: #94a3b8; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">El Rincón del Dualista</div>
    <p class="sub">Acceso para Clientes y Administradores</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form method="post" action="/login">
      <label>Usuario</label>
      <input type="text" name="usuario" placeholder="Ej: admin o cliente" required>
      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••••" required>
      <button type="submit" class="btn">Ingresar a la Plataforma</button>
    </form>

    <div class="creds">
      <strong>Cuentas de prueba integradas:</strong><br>
      • <b>Admin:</b> usuario <code>admin</code> / clave <code>admin123</code><br>
      • <b>Cliente:</b> usuario <code>cliente</code> / clave <code>1234</code>
    </div>
  </div>
</body>
</html>
