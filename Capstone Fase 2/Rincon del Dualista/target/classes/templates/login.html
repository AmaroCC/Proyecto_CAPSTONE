<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - El Rincón del Dualista</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b0c16; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .login-box { background: #121324; border: 1px solid #232542; border-radius: 16px; padding: 2.3rem; width: 100%; max-width: 440px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .brand { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 0.4rem; background: linear-gradient(135deg, #facc15, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.6rem; }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.4rem; font-weight: 600; }
    input { width: 100%; padding: 0.78rem; border-radius: 8px; border: 1px solid #2e325a; background: #0b0c16; color: #fff; margin-bottom: 1.1rem; }
    .btn { width: 100%; padding: 0.85rem; background: linear-gradient(135deg, #6366f1, #38bdf8); border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
    .btn-reg { display: block; width: 100%; text-align: center; padding: 0.8rem; margin-top: 0.8rem; background: rgba(16,185,129,0.15); border: 1px solid #10b981; border-radius: 8px; color: #34d399; font-weight: 700; text-decoration: none; font-size: 0.9rem; }
    .error { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 0.8rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.4; }
    .exito { background: rgba(16,185,129,0.15); border: 1px solid #10b981; color: #6ee7b7; padding: 0.8rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.4; }
    .confirm-btn { display: inline-block; margin-top: 0.6rem; padding: 0.45rem 0.85rem; background: #38bdf8; color: #0b0c16; font-weight: 800; border-radius: 6px; text-decoration: none; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">⚡ El Rincón del Dualista 🏴‍☠️</div>
    <p class="sub">Ingresa solo con tu Nombre de Usuario y Contraseña</p>

    <div th:if="${error}" class="error">
      <span th:text="${error}"></span>
      <div th:if="${linkConfirmacion != null}">
        <a th:href="${linkConfirmacion}" class="confirm-btn">✉️ Simular Clic en Correo de Confirmación</a>
      </div>
    </div>

    <div th:if="${exito}" class="exito">
      <span th:text="${exito}"></span>
      <div th:if="${linkConfirmacion != null}">
        <a th:href="${linkConfirmacion}" class="confirm-btn">✉️ Confirmar mi Correo Ahora</a>
      </div>
    </div>

    <form method="post" action="/login">
      <label>Nombre de Usuario</label>
      <input type="text" name="usuario" placeholder="Escribe tu nombre de usuario (ej: admin)" required>

      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••••" required>

      <button type="submit" class="btn">🔑 Iniciar Sesión</button>
    </form>

    <a href="/registro" class="btn-reg">📝 Crear Cuenta con Correo Electrónico</a>

    <div style="text-align:center; margin-top:1.2rem;">
      <a href="/" style="color:#94a3b8; font-size:0.85rem; text-decoration:none;">← Volver al Catálogo Principal</a>
    </div>
  </div>
</body>
</html>
