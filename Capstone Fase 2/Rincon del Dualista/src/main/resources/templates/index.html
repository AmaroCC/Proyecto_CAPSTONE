<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>El Rincón del Dualista - Marketplace TCG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b0c16; color: #e2e8f0; }
    .navbar { background: #121324; border-bottom: 1px solid #232542; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.35rem; font-weight: 800; background: linear-gradient(135deg, #a855f7, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
    .nav-links { display: flex; gap: 1rem; align-items: center; }
    .btn { padding: 0.55rem 1rem; border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-outline { border: 1px solid #38bdf8; color: #38bdf8; }
    .container { max-width: 1150px; margin: 2rem auto; padding: 0 1.5rem; }
    .search-bar { background: #121324; border: 1px solid #232542; padding: 1.25rem; border-radius: 12px; display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .search-bar input, .search-bar select { padding: 0.75rem; border-radius: 8px; border: 1px solid #2e325a; background: #0b0c16; color: #fff; flex: 1; min-width: 200px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
    .card { background: #121324; border: 1px solid #232542; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
    .card img { width: 100%; height: 310px; object-fit: contain; background: #080912; padding: 12px; }
    .card-body { padding: 1.2rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .badge { align-self: flex-start; font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 6px; background: rgba(56,189,248,0.15); color: #38bdf8; }
    .price-clp { font-size: 1.35rem; font-weight: 800; color: #34d399; margin-top: 0.4rem; }
    .price-usd { font-size: 0.8rem; color: #94a3b8; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">El Rincón del Dualista</a>
    <div class="nav-links">
      <a href="/publicar" class="btn btn-primary">📸 Escanear Carta con IA</a>
      <a th:if="${rol == 'ADMIN'}" href="/admin" class="btn btn-outline">⚙️ Panel Admin</a>
      <span th:if="${usuario != null}" th:text="'Hola, ' + ${usuario}" style="color:#94a3b8; font-size:0.9rem;"></span>
      <a th:if="${usuario == null}" href="/login" class="btn btn-outline">Iniciar Sesión</a>
      <a th:if="${usuario != null}" href="/logout" class="btn btn-outline">Salir</a>
    </div>
  </nav>

  <main class="container">
    <div class="search-bar">
      <input type="text" id="busquedaInput" placeholder="Buscar carta en Pokémon TCG, One Piece TCG o catálogo (ej: Luffy, Charizard, Pikachu)..." onkeyup="filtrarCatalogo()">
      <select id="juegoSelect" onchange="filtrarCatalogo()">
        <option value="TODOS">Todos los Juegos (Pokémon + One Piece)</option>
        <option value="Pokémon TCG">Pokémon TCG</option>
        <option value="One Piece TCG">One Piece TCG</option>
      </select>
      <button class="btn btn-primary" onclick="buscarEnApiGlobal()">🌐 Buscar en API Oficial Pokémon</button>
    </div>

    <div class="grid" id="contenedorCartas">
      <div class="card" th:each="c : ${cartas}">
        <img th:src="${c.imagenUrl}" alt="Carta TCG">
        <div class="card-body">
          <span class="badge" th:text="${c.juego}"></span>
          <h3 style="font-size:1rem;" th:text="${c.nombre}"></h3>
          <p style="font-size:0.8rem; color:#94a3b8;" th:text="${c.rareza + ' • ' + c.estado}"></p>
          <div class="price-clp" th:text="'$' +${#numbers.formatInteger(c.precioCLP, 1, 'POINT')} + ' CLP'"></div>
          <div class="price-usd" th:text="'Ref: $' +${c.precioUSD} + ' USD'"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function filtrarCatalogo() {
      const q = document.getElementById('busquedaInput').value;
      const juego = document.getElementById('juegoSelect').value;
      const res = await fetch(`/api/cartas/buscar?q=${encodeURIComponent(q)}&juego=${encodeURIComponent(juego)}`);
      const data = await res.json();
      renderizarCartas(data);
    }

    // Conecta en vivo con la API pública de TCGdex para traer cualquier carta de Pokémon
    async function buscarEnApiGlobal() {
      const q = document.getElementById('busquedaInput').value.trim();
      if (!q) return alert('Escribe el nombre de un Pokémon (ej: Pikachu, Mew, Rayquaza)');
      const res = await fetch(`https://api.tcgdex.net/v2/en/cards?name=${encodeURIComponent(q)}`);
      const cartasApi = await res.json();
      const adaptadas = cartasApi.filter(c => c.image).slice(0, 8).map(c => {
        const usd = (Math.random() * 85 + 8).toFixed(2);
        return {
          nombre: c.name + ' (' + c.localId + ')',
          juego: 'Pokémon TCG (API Live)',
          rareza: 'Edición Oficial',
          estado: 'Near Mint',
          precioUSD: usd,
          precioCLP: Math.round(usd * 945.5),
          imagenUrl: c.image + '/low.webp'
        };
      });
      renderizarCartas(adaptadas);
    }

    function renderizarCartas(lista) {
      const cont = document.getElementById('contenedorCartas');
      cont.innerHTML = lista.map(c => `
        <div class="card">
          <img src="${c.imagenUrl}" alt="${c.nombre}">
          <div class="card-body">
            <span class="badge">${c.juego}</span>
            <h3 style="font-size:1rem;">${c.nombre}</h3>
            <p style="font-size:0.8rem; color:#94a3b8;">${c.rareza} • ${c.estado}</p>
            <div class="price-clp">$${Number(c.precioCLP).toLocaleString('es-CL')} CLP</div>
            <div class="price-usd">Ref: $${c.precioUSD} USD</div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
