<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Rincón del Duelista - Publicar Carta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #0b0c16;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-container {
      background-color: #121324;
      width: 100%;
      max-width: 850px;
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #232542;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232542;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .header h2 {
      font-size: 1.25rem;
      color: #38bdf8;
    }
    .badge {
      font-size: 0.75rem;
      background-color: #064e3b;
      color: #6ee7b7;
      border: 1px solid #059669;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-weight: 600;
    }
    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 768px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }
    .upload-box {
      border: 2px dashed #334155;
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0b0c16;
      text-align: center;
    }
    .preview-card {
      width: 180px;
      height: 250px;
      background-color: #1e1b4b;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 0.85rem;
      border: 1px solid #4338ca;
      overflow: hidden;
      position: relative;
    }
    .preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .btn-upload {
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s;
    }
    .btn-upload:hover {
      transform: translateY(-2px);
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 0.25rem;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      background-color: #0b0c16;
      border: 1px solid #232542;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      color: white;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }
    .two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .price-box {
      background-color: #0b0c16;
      border: 1px solid #232542;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.75rem;
      margin-bottom: 1rem;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.25rem;
    }
    .price-row span:last-child {
      font-family: monospace;
      color: #38bdf8;
    }
    .footer-actions {
      margin-top: 1.5rem;
      border-top: 1px solid #232542;
      padding-top: 1rem;
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }
    .btn-cancel {
      background-color: #232542;
      color: #cbd5e1;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-cancel:hover {
      background-color: #334155;
      color: white;
    }
    .btn-submit {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="header">
      <h2>El Rincón del Duelista - Publicar Carta</h2>
      <span class="badge">Escrow Activo</span>
    </div>

    <div class="grid-layout">
      <!-- Columna Carga IA -->
      <div class="upload-box">
        <div class="preview-card" id="previewContainer">
          <span id="placeholderText">[ Vista Previa / OpenCV ]</span>
          <img id="cardImage" alt="Vista previa de la carta">
        </div>
        
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
          Subir Fotografía
        </button>
        
        <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 0.5rem;">
          Detección automática de carta y cotización por IA
        </p>
      </div>

      <!-- Columna Formulario y Cotización -->
      <div>
        <div class="form-group">
          <label>Carta detectada</label>
          <input type="text" id="cardName" placeholder="Esperando carga de imagen..." readonly>
        </div>

        <div class="form-group two-cols">
          <div>
            <label>Estado sugerido por IA</label>
            <input type="text" id="cardState" placeholder="--" style="color: #34d399; font-weight: bold;" readonly>
          </div>
          <div>
            <label>Ref. USA (USD)</label>
            <input type="text" id="usdPrice" placeholder="--" readonly>
          </div>
        </div>

        <div class="price-box">
          <div class="price-row">
            <span>Dólar observado (mindicador):</span>
            <span id="dolarValue">$921.85 CLP</span>
          </div>
          <div class="price-row">
            <span>Valor estimado de mercado:</span>
            <span id="estimatedValue">--</span>
          </div>
        </div>

        <div class="form-group">
          <label>Tu Precio de Venta (CLP)</label>
          <input type="number" id="clpSalePrice" placeholder="0" style="border-color: #6366f1; font-weight: bold; font-size: 1rem;">
        </div>
      </div>
    </div>

    <!-- Botón Cancelar con función de retroceso hacia index.html -->
    <div class="footer-actions">
      <button class="btn-cancel" onclick="goBackOrHome()">Cancelar</button>
      <button class="btn-submit" onclick="alert('Publicación confirmada exitosamente en El Rincón del Duelista.')">Confirmar y Publicar</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const cardImage = document.getElementById('cardImage');
    const placeholderText = document.getElementById('placeholderText');

    const cardName = document.getElementById('cardName');
    const cardState = document.getElementById('cardState');
    const usdPrice = document.getElementById('usdPrice');
    const clpSalePrice = document.getElementById('clpSalePrice');
    const estimatedValue = document.getElementById('estimatedValue');

    fileInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          cardImage.src = e.target.result;
          cardImage.style.display = 'block';
          placeholderText.style.display = 'none';

          cardName.value = "Charizard ex - Special Illustration Rare";
          cardState.value = "Near Mint (95%)";
          usdPrice.value = "$97.63 USD";
          clpSalePrice.value = 90000;
          estimatedValue.innerText = "$90.000 CLP";
        };
        reader.readAsDataURL(file);
      }
    });

    // Función que retrocede en el historial o redirige a index.html
    function goBackOrHome() {
      if (document.referrer && document.referrer.includes('index.html')) {
        window.history.back();
      } else {
        window.location.href = 'Subir.html';
      }
    }
  </script>

</body>
</html>
